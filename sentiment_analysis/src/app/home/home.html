<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis
    </title>
</head>
<body>
  <div class="container">
  <h1>Google Maps Review Sentiment Analysis</h1>

  <div class="input-group">
    <label>Place URL:</label>
    <input [(ngModel)]="url" type="text" placeholder="Paste Google Maps URL" />
  </div>

  <div class="input-group">
    <label>Choose Model:</label>
    <select [(ngModel)]="model">
      <option value="gemini">Gemini</option>
      <option value="multilingual">Multilingual</option>
    </select>
  </div>

  <button (click)="runAnalysis()">🚀 Run Analysis</button>

  <div *ngIf="loading" class="loading">
    Running analysis... please wait ⏳
  </div>

  <table *ngIf="reviews.length > 0">
    <thead>
      <tr>
        <th>Review</th>
        <th>Rating</th>
        <th>Sentiment</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let review of reviews">
        <td>{{ review.review }}</td>
        <td>{{ review.rating }}</td>
        <td
          [ngClass]="{
            'sentiment-positive': review.sentiment === 'Positive',
            'sentiment-negative': review.sentiment === 'Negative',
            'sentiment-neutral': review.sentiment === 'Neutral'
          }"
        >
          {{ review.sentiment }}
        </td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
